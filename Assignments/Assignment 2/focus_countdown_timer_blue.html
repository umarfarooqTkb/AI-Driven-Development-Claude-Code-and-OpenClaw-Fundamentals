
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Focus Countdown Timer</title>
<style>
body{
 font-family:Arial,sans-serif;
 background:#eaf4ff;
 display:flex;justify-content:center;align-items:center;
 min-height:100vh;margin:0;
}
.card{
 background:white;width:420px;padding:35px;
 border-radius:20px;text-align:center;
 box-shadow:0 10px 30px rgba(0,0,0,.12);
}
h1{color:#2b6cb0;}
#mode{font-size:20px;color:#4a6fa5;}
#timer{font-size:72px;font-weight:bold;color:#1e4f8a;margin:25px 0;}
button{
 padding:16px 28px;
 margin:8px;
 border:none;
 border-radius:10px;
 cursor:pointer;
 font-size:18px;
 font-weight:bold;
}
.start{background:#4a90e2;color:white;}
.pause{background:#7fb3f0;color:white;}
.reset{background:#b7d4f7;color:#123;}
</style>
</head>
<body>
<div class="card">
<h1>Focus Timer</h1>
<div id="mode">Work Session</div>
<div id="timer">25:00</div>
<button class="start" onclick="startTimer()">Start</button>
<button class="pause" onclick="pauseTimer()">Pause</button>
<button class="reset" onclick="resetTimer()">Reset</button>
</div>

<script>
let workTime=25*60, breakTime=5*60, timeLeft=workTime, isWork=true, interval=null;

function updateDisplay(){
 let m=Math.floor(timeLeft/60), s=timeLeft%60;
 document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
 document.getElementById('mode').textContent=isWork?'Work Session':'Break Time';
}

function beep(){
 const ctx=new(window.AudioContext||window.webkitAudioContext)();
 const osc=ctx.createOscillator(), gain=ctx.createGain();
 osc.connect(gain); gain.connect(ctx.destination);
 osc.frequency.value=880; gain.gain.value=.2;
 osc.start(); setTimeout(()=>{osc.stop();ctx.close();},800);
}

function startTimer(){
 if(interval) return;
 interval=setInterval(()=>{
   timeLeft--; updateDisplay();
   if(timeLeft<=0){
     beep();
     isWork=!isWork;
     timeLeft=isWork?workTime:breakTime;
     updateDisplay();
   }
 },1000);
}

function pauseTimer(){ clearInterval(interval); interval=null; }

function resetTimer(){
 pauseTimer();
 isWork=true;
 timeLeft=workTime;
 updateDisplay();
}

updateDisplay();
</script>
</body>
</html>
