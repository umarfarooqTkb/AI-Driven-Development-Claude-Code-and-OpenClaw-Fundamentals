<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rosie's Dog Walking Calculator</title>
  <style>
    /* Basic reset and layout styles */
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, sans-serif;
      max-width: 400px;
      margin: 2rem auto;
      padding: 0 1rem;
      line-height: 1.5;
    }
    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .input-group {
      margin-bottom: 1rem;
    }
    .input-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: bold;
    }
    .input-group input,
    .input-group select {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
    }
    #output {
      margin-top: 1rem;
      padding: 0.8rem;
      background: #f5f5f5;
      border-radius: 4px;
      display: none;
    }
    #output.visible {
      display: block;
    }
    #error-msg {
      color: #d32f2f;
      margin-top: 0.5rem;
      font-size: 0.8rem;
      display: none;
    }
    #error-msg.visible {
      display: block;
    }
  </style>
</head>
<body>
  <h1>Rosie's Dog Walking Calculator</h1>

  <div class="input-group">
    <label for="dog-count">Number of dogs:</label>
    <select id="dog-count">
      <option value="1">1 dog</option>
      <option value="2">2 dogs</option>
      <option value="3">3 dogs</option>
    </select>
  </div>

  <div class="input-group">
    <label>
      <input type="checkbox" id="same-day"> Same-day booking
    </label>
  </div>

  <div class="input-group">
    <label>
      <input type="checkbox" id="holiday"> Holiday walk
    </label>
  </div>

  <div id="output" class="visible">
    <p><strong>Base rate:</strong> $<span id="base-rate">0</span></p>
    <p><strong>Multi-dog discount:</strong> $<span id="discount">0</span></p>
    <p><strong>Same-day surcharge:</strong> $<span id="surcharge">0</span></p>
    <p><strong>Holiday effect:</strong> $<span id="holiday-effect">0</span></p>
    <hr>
    <p><strong>Final total:</strong> $<span id="total">0</span></p>
  </div>

  <p id="error-msg">Please select at least 1 dog</p>

  <script>
    const CONFIG = {
      baseRate: 5,
      sameDaySurcharge: 2,
      holidayMultiplier: 2,
      rounding: 2
    };

    function updateTotal() {
      const dogCountSelect = document.getElementById('dog-count');
      const sameDayInput = document.getElementById('same-day');
      const holidayInput = document.getElementById('holiday');
      const output = document.getElementById('output');
      const errorMsg = document.getElementById('error-msg');
      const baseRateSpan = document.getElementById('base-rate');
      const discountSpan = document.getElementById('discount');
      const surchargeSpan = document.getElementById('surcharge');
      const holidayEffectSpan = document.getElementById('holiday-effect');
      const totalSpan = document.getElementById('total');

      const dogCount = parseInt(dogCountSelect.value);

      // Input validation: at least 1 dog
      if (dogCount < 1) {
        output.classList.remove('visible');
        errorMsg.classList.add('visible');
        return;
      }

      errorMsg.classList.remove('visible');
      output.classList.add('visible');

      // 1. Base total
      let total = dogCount * CONFIG.baseRate;

      // 2. Multi-dog discount: 50% off all dogs after the first
      let discount = 0;
      if (dogCount > 1) {
        discount = CONFIG.baseRate * 0.5 * (dogCount - 1);
      }

      // 3. Same-day surcharge (applied to full base rate, not discounted)
      let surcharge = 0;
      let holidayEffect = 0;
      let mechanism = 'base'; // track which mechanism applies

      const sameDay = sameDayInput.checked;
      const holiday = holidayInput.checked;

      if (sameDay && holiday) {
        // "Larger wins" conflict resolution (EC-2)
        // Holiday extra: baseRate * (holidayMultiplier - 1) = $5
        // Same-day surcharge: $2
        // Holiday wins since $5 > $2
        if (CONFIG.baseRate * (CONFIG.holidayMultiplier - 1) > CONFIG.sameDaySurcharge) {
          // Apply holiday only
          holidayEffect = CONFIG.baseRate * (CONFIG.holidayMultiplier - 1);
          total = CONFIG.baseRate * CONFIG.holidayMultiplier;
          mechanism = 'holiday';
        } else {
          // Apply same-day only
          surcharge = CONFIG.sameDaySurcharge;
          total = CONFIG.baseRate + CONFIG.sameDaySurcharge;
          mechanism = 'same-day';
        }
      } else if (sameDay) {
        surcharge = CONFIG.sameDaySurcharge;
        total = CONFIG.baseRate + CONFIG.sameDaySurcharge;
        mechanism = 'same-day';
      } else if (holiday) {
        total = CONFIG.baseRate * CONFIG.holidayMultiplier;
        holidayEffect = CONFIG.baseRate * (CONFIG.holidayMultiplier - 1);
        mechanism = 'holiday';
      }

      // 4. Rounding: single point at display boundary (EC-3)
      total = Math.round(total * CONFIG.rounding) / CONFIG.rounding;
      discount = Math.round(discount * CONFIG.rounding) / CONFIG.rounding;
      surcharge = Math.round(surcharge * CONFIG.rounding) / CONFIG.rounding;
      holidayEffect = Math.round(holidayEffect * CONFIG.rounding) / CONFIG.rounding;

      // 5. Display breakdown
      baseRateSpan.textContent = CONFIG.baseRate;
      discountSpan.textContent = discount;
      surchargeSpan.textContent = surcharge;
      holidayEffectSpan.textContent = holidayEffect;
      totalSpan.textContent = total;

      // Force reflow for display update
      output.classList.remove('visible');
      void output.offsetWidth;
      output.classList.add('visible');
    }

    // Wire inputs to updateTotal on change (FR-6: real-time; AC-6)
    document.getElementById('dog-count').onchange = updateTotal;
    document.getElementById('same-day').onclick = updateTotal;
    document.getElementById('holiday').onclick = updateTotal;

    // Initial call on page load (AC-6: real-time from start)
    updateTotal();
  </script>
</body>
</html>
